<!doctype html>
<html lang="pt-PT" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicons/galo.svg" />
    <script>
      // Random Tuga Favicon Logic
      const icons = [
        '/favicons/acordeao.svg', // Acordeão (Accordion)
        '/favicons/bandeira.svg', // Bandeira (Flag)
        '/favicons/bigode.svg',   // Bigode (Mustache)
        '/favicons/galo.svg',     // Galo (Classic)
        '/favicons/sardinha.svg', // Sardinha (Sardine)
        '/favicons/vinho.svg'     // Vinho (Wine Glass)
      ];
      const randomIcon = icons[Math.floor(Math.random() * icons.length)];
      document.getElementById('favicon').href = randomIcon;
      // Dark is the default; only a saved "light" choice turns it off, before first paint.
      try { if (localStorage.getItem('tuga-theme') === 'light') document.documentElement.classList.remove('dark'); } catch (e) {}
    </script>
